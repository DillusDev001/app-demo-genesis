<div *ngIf="isOpen" class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2  z-50 w-full h-full overflow-auto">

  <div
    class="flex w-full min-h-full bg-black/50 backdrop-filter backdrop-blur-sm shadow-lg items-center justify-center p-4 overflow-auto">

    <div *ngIf="isLoading"
      class="relative flex flex-col gap-4 w-full max-h-full bg-white shadow-md py-8 rounded-lg  items-center">
      <app-custom-loading></app-custom-loading>
    </div>

    <div *ngIf="!isLoading"
      class="relative flex flex-col w-full max-w-md bg-white shadow-md rounded-xl  items-center overflow-hidden">

      <!-- Ventana Cabecera -->
      <div class="w-full h-max flex gap-4 justify-between items-center px-3 py-1" [ngClass]="getModalHeaderColor()">
        <p class="tracking-wide font-semibold">
          <span>{{ title }}</span>
        </p>
        <button
          class=" text-white rounded-lg text-sm w-8 h-8 ms-auto inline-flex justify-center items-center cursor-pointer" [ngClass]="getModalCloseColor()"
          (click)="onCloseModal()">
          <svg class="w-3 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">¸
            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6" />
          </svg>
        </button>
      </div>

      <!-- Contenido -->
      <div class="w-full flex flex-col gap-2 overflow-auto p-4 items-center">

        <div class="rounded-full p-2 border-2 flex items-center justify-center w-12 h-12"
          [ngClass]="getModalIconColor()">
          <app-custom-icon [span]="getModalIconColor()" [icon]="getModalIcon()"></app-custom-icon>
        </div>

        <p [innerHTML]="content" class="text-base tracking-wide font-bold text-center"></p>

        <br>

        <div class="w-full flex gap-4 justify-center">
          <app-custom-button class="w-40" [label]="button" [type]="'accept'"
            [class]="getModalButtonColor()" [valid]="true" (click)="onClickModal(true)"></app-custom-button>

          <app-custom-button *ngIf="type === 'warning'" class="w-40" [label]="'Cancelar'" [type]="'cancel'" [valid]="true"
            (click)="onClickModal(false)"></app-custom-button>
        </div>

      </div>

    </div>

  </div>
