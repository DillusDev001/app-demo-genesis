<div class="fixed top-2 right-2 flex flex-col items-end space-y-2 z-50">
  <div *ngFor="let notification of notifications, index as i" class="p-3 rounded-lg shadow-lg"
    [ngClass]="getNotificationType(notification.type)">
    <div class="flex items-center gap-4 text-white w-full md:w-max">
      <i [ngClass]="getNotificationIcon(notification.type)"></i>
      <p class="text-sm">{{ notification.message }}</p>

      <button
          class=" text-white rounded-lg text-sm w-8 h-8 ms-auto inline-flex justify-center items-center cursor-pointer bg-white/30"
          (click)="onClickClose(i)">
          <svg class="w-3 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">¸
            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6" />
          </svg>
        </button>
      
    </div>
  </div>
</div>
