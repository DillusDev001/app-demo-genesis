<div class="flex gap-3 w-max h-max">
  <div class="flex items-center h-5">
    <input id="view" type="checkbox" [formControl]="control"
      class="w-4 h-4 bg-white border rounded border-[var(--color-text)]
      focus:ring-[var(--color-focus)] focus:ring-2 focus:ring-offset-2 outline-none
      checked:text-[var(--color-whatsapp)]"/>
  </div>
  <label for="view" class="">{{ label }}</label>
</div>
