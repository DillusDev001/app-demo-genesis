<div class="bg-white rounded-lg w-[60vw]">
  <h2 class="text-xl sm:text-2xl font-bold mb-4 px-6 pt-6">{{ data?.idDireccion ? 'Editar Dirección' : 'Añadir Nueva
    Dirección' }}</h2>

  <form [formGroup]="addressForm" (ngSubmit)="saveAddress()" class="flex flex-col lg:flex-row">

    <!-- Columna del Mapa -->
    <div class="lg:w-1/2 p-4 border-b lg:border-b-0 lg:border-r border-gray-200">
      <div class="h-64 md:h-[50vh] rounded-lg overflow-hidden relative bg-gray-200">
        <google-map [options]="mapOptions" (mapClick)="onMapClick($event)" height="100%" width="100%">
          <map-marker *ngIf="markerPosition" [position]="markerPosition">
          </map-marker>
        </google-map>
      </div>
      <div *ngIf="addressForm.controls['lat'].hasError('required') && addressForm.controls['lat'].touched"
        class="text-red-500 text-xs mt-1">
        Por favor, selecciona una ubicación en el mapa.
      </div>
      
      <!-- BOTÓN PARA ENCONTRAR UBICACIÓN -->
      <div class="mt-4 text-center">
        <button type="button" (click)="centerMapOnUserLocation()"
          class="inline-flex items-center px-4 py-2 text-sm font-medium text-white bg-indigo-600 border border-transparent rounded-md shadow-sm hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
          <!-- Icono de ubicación -->
          <svg class="w-5 h-5 mr-2 -ml-1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
            <path fill-rule="evenodd" d="M10 3a7 7 0 00-7 7c0 3.866 7 10 7 10s7-6.134 7-10a7 7 0 00-7-7zm0 9a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd" />
          </svg>
          Encontrar mi Ubicación
        </button>
      </div>
      <!-- FIN BOTÓN -->

    </div>

    <!-- Columna del Formulario -->
    <div class="lg:w-1/2 p-4">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

        <div class="md:col-span-2">
          <label for="calle" class="block text-sm font-medium text-gray-700">Calle y Número</label>
          <input type="text" id="calle" formControlName="calle"
            class="h-10 w-full rounded px-4 border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
        </div>

        <div>
          <label for="ciudad" class="block text-sm font-medium text-gray-700">Ciudad</label>
          <input type="text" id="ciudad" formControlName="ciudad"
            class="h-10 w-full rounded px-4 border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
        </div>

        <div>
          <label for="departamento" class="block text-sm font-medium text-gray-700">Departamento</label>
          <input type="text" id="departamento" formControlName="departamento"
            class="h-10 w-full rounded px-4 border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
        </div>

        <div>
          <label for="codigoPostal" class="block text-sm font-medium text-gray-700">Código Postal</label>
          <input type="text" id="codigoPostal" formControlName="codigoPostal"
            class="h-10 w-full rounded px-4 border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
        </div>

        <div>
          <label for="pais" class="block text-sm font-medium text-gray-700">País</label>
          <input type="text" id="pais" formControlName="pais"
            class="h-10 w-full rounded px-4 border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
        </div>

        <!-- Lat y Lng (Solo Lectura) -->
        <div class="md:col-span-2 grid grid-cols-2 gap-4">
          <div>
            <label for="lat" class="block text-sm font-medium text-gray-700">Latitud</label>
            <input type="number" id="lat" formControlName="lat" readonly
              class="h-10 w-full rounded px-4 border-gray-300 shadow-sm sm:text-sm bg-gray-100 cursor-not-allowed">
          </div>
          <div>
            <label for="lng" class="block text-sm font-medium text-gray-700">Longitud</label>
            <input type="number" id="lng" formControlName="lng" readonly
              class="h-10 w-full rounded px-4 border-gray-300 shadow-sm sm:text-sm bg-gray-100 cursor-not-allowed">
          </div>
        </div>
      </div>
    </div>
  </form>

  <!-- Botones de Acción -->
  <div class="mt-6 flex justify-end space-x-4 bg-gray-50 px-6 py-4 rounded-b-lg">
    <button type="button" (click)="closeModal()"
      class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-md hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-500 transition-colors duration-300">Cancelar</button>
    <button (click)="saveAddress()" [disabled]="addressForm.invalid"
      class="px-4 py-2 text-sm font-medium text-white bg-blue-600 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 disabled:opacity-50 disabled:cursor-not-allowed transition-colors duration-300">Guardar
      Dirección</button>
  </div>

</div>
