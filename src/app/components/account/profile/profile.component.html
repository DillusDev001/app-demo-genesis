<div class="flex flex-col gap-4 p-4 bg-white h-full">
  <!-- Datos Personales -->
  <div class="bg-white border border-gray-200 p-8 rounded-lg shadow-lg">
    <div class="flex justify-between items-center mb-6">
      <div>
        <p class="text-4xl font-bold">Datos Personales</p>
        <p class="text-gray-500">Actualiza tu información personal y dirección de correo electrónico.</p>
      </div>
    </div>
    <form [formGroup]="profileForm" (ngSubmit)="onSubmit()" class="space-y-6">
      <div class="grid grid-cols-2 gap-6">
        <div class="flex flex-col gap-2">
          <label for="name" class="font-bold">Nombre Completo</label>
          <input type="text" id="name" formControlName="nombre" class="h-10 w-full rounded px-4 border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
        </div>
        <div class="flex flex-col gap-2">
          <label for="email" class="font-bold">Correo Electrónico</label>
          <input type="email" id="email" formControlName="email" class="h-10 w-full rounded px-4 border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
        </div>
        <div class="flex flex-col gap-2">
          <label for="whatsapp" class="font-bold">Nro WhatsApp</label>
          <input type="text" id="whatsapp" formControlName="whatsapp" class="h-10 w-full rounded px-4 border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
        </div>
      </div>
      <div class="text-right">
        <button type="submit" [disabled]="!profileForm.valid" class="inline-flex justify-center py-2 px-4 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
          Guardar Cambios
        </button>
      </div>
    </form>
  </div>
</div>
