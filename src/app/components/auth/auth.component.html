<div class="flex justify-center items-center min-h-screen bg-gray-50 px-4">
  <div class="w-full max-w-md bg-white p-8 rounded-lg shadow-md">
    <div class="flex justify-center mb-6 border-b">
      <button (click)="setUserType('comprador')"
        [ngClass]="{'border-b-2 border-blue-500 text-blue-500': userType === 'comprador', 'text-gray-500': userType !== 'comprador'}"
        class="py-2 px-4 font-semibold focus:outline-none cursor-pointer hover:bg-blue-400 hover:text-white">
        Comprador
      </button>
      <button (click)="setUserType('vendedor')"
        [ngClass]="{'border-b-2 border-blue-500 text-blue-500': userType === 'vendedor', 'text-gray-500': userType !== 'vendedor'}"
        class="py-2 px-4 font-semibold focus:outline-none cursor-pointer hover:bg-blue-400 hover:text-white">
        Vendedor
      </button>
    </div>

    <div class="text-center">
      <h2 class="text-2xl font-bold mb-2">Bienvenido de Vuelta</h2>
      <p class="text-gray-600 mb-6">Inicia sesión o crea una cuenta para continuar.</p>
    </div>

    <button *ngIf="userType === 'comprador'" (click)="signInWithGoogle()"
      class="w-full flex justify-center items-center gap-2 bg-white border border-gray-300 text-gray-700 font-semibold py-2 px-4 rounded-lg hover:bg-gray-100 transition-colors mb-4">
      <svg class="w-6 h-6" version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"
        xmlns:xlink="http://www.w3.org/1999/xlink" style="display: block;">
        <path fill="#EA4335"
          d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z">
        </path>
        <path fill="#4285F4"
          d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z">
        </path>
        <path fill="#FBBC05"
          d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z">
        </path>
        <path fill="#34A853"
          d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z">
        </path>
        <path fill="none" d="M0 0h48v48H0z"></path>
      </svg>
      Continuar con Gmail
    </button>

    <div *ngIf="userType === 'comprador'" class="flex items-center my-4">
      <hr class="flex-grow border-t border-gray-300">
      <span class="mx-2 text-gray-500">o</span>
      <hr class="flex-grow border-t border-gray-300">
    </div>

    <form [formGroup]="authForm" (ngSubmit)="onSubmit()">
      <div class="mb-4" *ngIf="!isLoginMode && userType === 'comprador'">
        <label class="block text-gray-700 text-sm font-bold mb-2" for="nombre">Nombre Completo</label>
        <input
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
          id="nombre" type="text" placeholder="Nombre completo" formControlName="nombre">
      </div>

      <div class="mb-4" *ngIf="!isLoginMode && userType === 'comprador'">
        <label class="block text-gray-700 text-sm font-bold mb-2" for="nombre">Whatsapp</label>
        <input
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
          id="whatsapp" type="text" placeholder="63051500" formControlName="whatsapp">
      </div>

      <div class="mb-4">
        <label class="block text-gray-700 text-sm font-bold mb-2" for="email">Correo electrónico</label>
        <input
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
          id="email" type="email" placeholder="tu@email.com" formControlName="email">
      </div>

      <div class="mb-4">
        <label class="block text-gray-700 text-sm font-bold mb-2" for="password">Contraseña</label>
        <input
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
          id="password" type="password" placeholder="**************" formControlName="password">
      </div>

      <div class="text-right mb-6" *ngIf="isLoginMode">
        <a href="#" class="text-sm text-blue-500 hover:underline">¿Olvidaste tu contraseña?</a>
      </div>

      <div *ngIf="errorMessage" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4"
        role="alert">
        <span class="block sm:inline">{{ errorMessage }}</span>
      </div>

      <button
        class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded-lg focus:outline-none focus:shadow-outline transition-colors cursor-pointer"
        type="submit" [disabled]="authForm.invalid">
        {{ (isLoginMode || userType === 'vendedor') ? 'Iniciar Sesión' : 'Registrarse' }}
      </button>

      <div class="text-center mt-4" *ngIf="userType === 'comprador'">
        <a class="text-sm text-blue-500 hover:underline cursor-pointer" (click)="toggleMode()">
          {{ isLoginMode ? '¿No tienes una cuenta? Regístrate' : '¿Ya tienes cuenta? Inicia sesión' }}
        </a>
      </div>
    </form>
  </div>
</div>
