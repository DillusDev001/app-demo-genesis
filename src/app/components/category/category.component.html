<div class="container mx-auto p-4">
  <app-breadcrumb [items]="breadcrumbItems"></app-breadcrumb>

  <div *ngIf="isLoading" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 mt-6">
    <app-skeleton-card *ngFor="let i of [1, 2, 3, 4, 5, 6, 7, 8]"></app-skeleton-card>
  </div>

  <div *ngIf="!isLoading" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 mt-6">
    <app-category-card *ngFor="let category of categories" [category]="category"></app-category-card>
  </div>

  <div *ngIf="!isLoading && categories.length === 0" class="flex items-center gap-2 justify-center text-base mt-6">
    <p class="text-gray-500">No se encontraron categorías.</p>
  </div>
</div>
