<div class="container mx-auto p-4">
  <app-breadcrumb [items]="breadcrumbItems"></app-breadcrumb>

  <div *ngIf="isLoading" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 mt-6">
    <app-skeleton-card *ngFor="let i of [1, 2, 3, 4, 5, 6, 7, 8]"></app-skeleton-card>
  </div>

  <div *ngIf="!isLoading" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 mt-6">
    <app-product-card *ngFor="let product of products" [producto]="product"></app-product-card>
  </div>

  <div *ngIf="!isLoading && products.length === 0" class="flex items-center gap-2 justify-center text-base">
    <p class="text-gray-500">Productos no encontrados en</p>
    <p class="text-gray-800 fond-bold">{{ categoryName }}.</p>
  </div>
</div>
