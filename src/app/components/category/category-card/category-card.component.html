<a [routerLink]="['/categoria', category.nombre]">
    <div class="bg-white rounded-lg shadow-md overflow-hidden transform transition-transform hover:scale-105">
        <img [src]="category.imagen" [alt]="category.nombre" class="w-full h-48 object-cover">
        <div class="p-4">
            <h3 class="text-lg font-semibold text-gray-800">{{ category.nombre }}</h3>
            <p class="text-gray-600 mt-2">{{ category.descripcion }}</p>
        </div>
    </div>
</a>
