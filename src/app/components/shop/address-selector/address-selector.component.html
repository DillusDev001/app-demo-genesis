<div class="bg-white rounded-lg shadow-xl max-w-lg w-full p-6 m-4">

  <!-- Encabezado -->
  <div class="flex justify-between items-center border-b pb-3 mb-4">
    <h2 class="text-xl font-bold text-gray-800">Elige una dirección de envío</h2>
    <button (click)="closeModal()" class="text-gray-500 hover:text-gray-800 focus:outline-none">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
      </svg>
    </button>
  </div>

  <!-- Contenido del Modal -->
  <div class="space-y-4 max-h-80 overflow-y-auto pr-2 min-h-[200px]">

    <!-- Estado de Carga -->
    <div *ngIf="isLoading" class="flex justify-center items-center h-full">
      <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
    </div>

    <!-- Estado: No hay direcciones -->
    <div *ngIf="!isLoading && addresses.length === 0" class="text-center py-8">
      <p class="text-gray-500 mb-2">No tienes direcciones guardadas.</p>
      <p class="text-sm text-gray-400">Puedes agregar una desde tu perfil.</p>
    </div>

    <!-- Estado: Direcciones cargadas -->
    <ng-container *ngIf="!isLoading && addresses.length > 0">
      <label *ngFor="let address of addresses" (click)="selectAddress(address)"
        class="flex items-center p-4 rounded-lg border cursor-pointer transition-all"
        [ngClass]="{'bg-blue-50 border-blue-500 ring-2 ring-blue-500': selectedAddress?.idDireccion === address.idDireccion, 'border-gray-300 hover:bg-gray-50': selectedAddress?.idDireccion !== address.idDireccion}">

        <input type="radio" name="addressSelection" [value]="address.idDireccion"
          [checked]="selectedAddress?.idDireccion === address.idDireccion"
          class="h-4 w-4 text-blue-600 border-gray-300 focus:ring-blue-500">

        <div class="ml-4 text-sm flex-grow">
          <p class="font-semibold text-gray-800">{{address.calle}}</p>
          <p class="text-gray-600">{{address.ciudad}}, {{address.departamento}}</p>
          <p class="text-gray-500 text-xs">{{address.pais}}, C.P. {{address.codigoPostal}}</p>
        </div>
      </label>
    </ng-container>
  </div>

  <!-- Pie del Modal -->
  <div class="mt-6 pt-4 border-t flex justify-end space-x-4">
    <button (click)="closeModal()"
      class="px-6 py-2 text-gray-700 bg-gray-200 rounded-lg hover:bg-gray-300 transition-colors">
      Cancelar
    </button>
    <button (click)="confirmSelection()" [disabled]="!selectedAddress || isLoading || addresses.length === 0"
      class="px-6 py-2 font-semibold text-white bg-blue-600 rounded-lg hover:bg-blue-700 disabled:bg-gray-400 disabled:cursor-not-allowed transition-colors">
      Usar esta dirección
    </button>
  </div>

</div>
