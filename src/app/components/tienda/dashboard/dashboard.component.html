<div class="flex flex-col gap-4 p-4 bg-white h-full">
  <h1 class="text-3xl font-bold">Panel de Control</h1>

  <!-- Top Cards -->
  <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
    <div class="bg-gray-100 p-4 rounded-lg shadow">
      <h3 class="text-gray-500">Ventas Totales</h3>
      <p class="text-3xl font-bold">$12,500</p>
    </div>
    <div class="bg-gray-100 p-4 rounded-lg shadow">
      <h3 class="text-gray-500">Productos Activos</h3>
      <p class="text-3xl font-bold">45</p>
    </div>
    <div class="bg-gray-100 p-4 rounded-lg shadow">
      <h3 class="text-gray-500">Pedidos Recibidos</h3>
      <p class="text-3xl font-bold">120</p>
    </div>
  </div>

  <!-- Quick Actions -->
  <div>
    <h2 class="text-2xl font-bold">Acciones Rápidas</h2>
    <div class="flex gap-4 mt-2">
      <button class="bg-blue-600 text-white px-4 py-2 rounded-lg font-semibold">Gestionar Productos</button>
      <button class="bg-gray-200 text-gray-700 px-4 py-2 rounded-lg font-semibold">Crear Promoción</button>
    </div>
  </div>

  <!-- Key Statistics -->
  <div>
    <h2 class="text-2xl font-bold">Estadísticas Clave</h2>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-2">
      <div class="bg-gray-100 p-4 rounded-lg shadow">
        <h3 class="text-gray-500">Ventas Mensuales</h3>
        <p class="text-3xl font-bold">$2,500</p>
        <p class="text-green-500">Este Mes +15%</p>
        <div class="h-32 bg-gray-200 mt-4 rounded flex items-center justify-center">
          <p class="text-gray-400">Chart placeholder</p>
        </div>
      </div>
      <div class="bg-gray-100 p-4 rounded-lg shadow">
        <h3 class="text-gray-500">Productos Más Vendidos</h3>
        <p class="text-3xl font-bold">150</p>
        <p class="text-green-500">Este Mes +10%</p>
        <div class="h-32 bg-gray-200 mt-4 rounded flex items-center justify-center">
          <p class="text-gray-400">Chart placeholder</p>
        </div>
      </div>
    </div>
  </div>
</div>
